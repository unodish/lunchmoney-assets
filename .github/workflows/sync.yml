name: Live Property Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install HTTP Helper
        run: pip install httpx

      - name: Send Balance to Lunch Money
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: |
          cat << 'EOF' > live_sync.py
          import os
          import httpx

          api_key = os.environ.get("LUNCH_MONEY_API_KEY")

          print("Connecting to live developer portal...")

          # Using the official .dev endpoint to bypass firewall checks cleanly
          lm_url = "https://api.lunchmoney.dev/v2/assets/395514"
          lm_headers = {"Authorization": f"Bearer {api_key}"}
          lm_data = {"balance": "893325"}

          with httpx.Client() as client:
              response = client.put(lm_url, headers=lm_headers, json=lm_data)
              if response.status_code == 200 or response.status_code == 201:
                  print("✅ SUCCESS: Balance successfully updated on your Lunch Money Dashboard!")
              else:
                  print(f"❌ Lunch Money API error: {response.text}")
          EOF
          python live_sync.py
