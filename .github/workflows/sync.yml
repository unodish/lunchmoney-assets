name: Property Sync V4

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Scraping Tools
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Web Engines
        run: npx playwright install chromium

      - name: Run Asset Sync
        run: python main.py
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
          FIRECRAWL_KEY: "fake_key_to_bypass_check"





