name: Live Property Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install HTTP Helper
        run: pip install httpx

      # --- PROPERTY 1: Primary Home ---
      - name: Sync Primary Home Balance
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: |
          python -c '
          import os, httpx
          api_key = os.environ.get("LUNCH_MONEY_API_KEY")
          headers = {"Authorization": f"Bearer {api_key}"}
          url = "https://lunchmoney.dev"
          res = httpx.put(url, headers=headers, json={"balance": "893325"})
          print("✅ Primary Home Status:", res.status_code)
          if res.status_code != 200 and res.status_code != 201: print("Error:", res.text)
          '

      # --- PROPERTY 2: Investment Property ---
      - name: Sync Investment Property Balance
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: |
          python -c '
          import os, httpx
          api_key = os.environ.get("LUNCH_MONEY_API_KEY")
          headers = {"Authorization": f"Bearer {api_key}"}
          url = "https://lunchmoney.dev"
          res = httpx.put(url, headers=headers, json={"balance": "594700"})
          print("✅ Investment Property Status:", res.status_code)
          if res.status_code != 200 and res.status_code != 201: print("Error:", res.text)
          '
