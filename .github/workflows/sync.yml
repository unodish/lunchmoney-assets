name: Ultimate Property Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install HTTP Helper
        run: pip install httpx

      - name: Generate and Run Clean Sync Script
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: |
          cat << 'EOF' > live_sync.py
          import os
          import httpx

          api_key = os.environ.get("LUNCH_MONEY_API_KEY")
          asset_id = "395514"
          price = 893325  # Directly forces your verified home valuation into the data pack

          print(f"Bypassing cache hurdles. Pushing verified valuation ${price:,} directly to Asset ID: {asset_id}...")

          lm_url = f"https://lunchmoney.app{asset_id}"
          lm_headers = {"Authorization": f"Bearer {api_key}"}
          lm_data = {"balance": str(price)}

          with httpx.Client() as client:
              response = client.put(lm_url, headers=lm_headers, json=lm_data)
              if response.status_code in:
                  print("✅ SUCCESS: Balance successfully updated on your Lunch Money Dashboard!")
              else:
                  print(f"❌ Lunch Money API error: {response.text}")
          EOF
          python live_sync.py
