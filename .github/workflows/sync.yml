name: Ultimate Property Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install HTTP Helper
        run: pip install httpx

      - name: Generate and Run Clean Sync Script
        env:
          LUNCH_MONEY_API_KEY: ${{ secrets.LUNCHMONEY_TOKEN }}
        run: |
          cat << 'EOF' > live_sync.py
          import os
          import httpx

          api_key = os.environ.get("LUNCH_MONEY_API_KEY")
          asset_id = "395514"
          price = "893325"

          print(f"Bypassing Cloudflare blocks. Pushing balance directly to Asset ID: {asset_id}...")

          lm_url = f"https://lunchmoney.app{asset_id}"
          
          # Injects simulated Chrome Desktop signatures to satisfy Cloudflare firewall triggers
          lm_headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Origin": "https://lunchmoney.app",
              "Referer": "https://lunchmoney.app/"
          }
          
          lm_data = {"balance": str(price)}

          with httpx.Client(follow_redirects=True) as client:
              response = client.put(lm_url, headers=lm_headers, json=lm_data)
              if response.status_code == 200 or response.status_code == 201:
                  print("✅ SUCCESS: Balance successfully updated on your Lunch Money Dashboard!")
              else:
                  print(f"❌ Lunch Money API error status {response.status_code}: {response.text[:200]}")
          EOF
          python live_sync.py
